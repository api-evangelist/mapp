  scope: per-account
  window: per second
  limit: 10
  unit: transactions per second
  burst: null
  status_code_on_exhaustion: 500
  error_description: Database Access Limit Exceeded
  documented_action: Reduce the load to ~10 tps or contact Technical Support.
  source: https://docs.mapp.com/apidocs/engage-api-error-handling
  note: Stated as an approximate ceiling ("~10 tps") in the response-code table, not as a contract.
