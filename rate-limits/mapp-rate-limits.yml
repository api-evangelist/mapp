source: https://docs.mapp.com/apidocs/engage-api-error-handling, https://docs.mapp.com/apidocs/product-catalog-api-data-limits-and-validation-rules
note: Mapp publishes one real throughput ceiling and no runtime rate-limit signalling at all. There is no 429, no
  RateLimit-* or X-RateLimit-* header, and no Retry-After. A client that exceeds the Engage ceiling receives HTTP
  500 with the description "Database Access Limit Exceeded" — a server-error status carrying a client-throttling
  meaning, which no generic HTTP client and no agent will back off from correctly. Retry guidance is a fixed human
  ladder (30 seconds, then 15 minutes, then contact support) rather than a returned value.
limit_count: 1
