- date: '2026-07-31'
  title: 'Mapp Engage: new API endpoints for Segments, Attributes, Whiteboards and Audit Log'
  breaking: false
  additions: true
  highlights:
  - Segments can now be created, retrieved, updated, published and deleted via the API.
  - Profile, member, group and address attributes are now fully manageable via the API.
  - Whiteboards (marketing automations) can be created, updated, validated, published and deleted.
  - A new Log Tracker audit-log endpoint returns login, message, group, import/export and automation events for
    SIEM ingestion.
  - Mapp frames these additions explicitly as support for "automated, headless, and agent-driven integrations".
  url: https://docs.mapp.com/docs/mapp-engage-new-public-api-endpoints-in-api-v19
