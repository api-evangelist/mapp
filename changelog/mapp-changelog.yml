- date: '2026-07-09'
  title: 'Mapp Intelligence: new Analytics API domains'
  breaking: false
  additions: false
  highlights:
  - Analytics API requests move to api.mapp.com under /api/analytics.
  - Token issuance moves to https://auth.mapp.com/oauth2/token.
  - Old endpoints still redirect, but API responses reference the new domains regardless of which host was called,
    so host-allowlisted integrations can fail on result retrieval.
  - Existing Client IDs and Secrets were migrated automatically.
  url: https://docs.mapp.com/docs/mapp-intelligence-new-analytics-api-domains
- date: '2026-05-28'
  title: 'Mapp Cloud: centralized API Client management'
  breaking: false
  additions: false
  highlights:
  - API Client IDs and Secrets are now managed in one place and apply across all Mapp APIs, current and future.
  - Settings moved from the Mapp Intelligence area to a new Mapp Cloud section.
  url: https://docs.mapp.com/docs/mapp-cloud-centralized-api-client-management
