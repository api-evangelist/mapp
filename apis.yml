aid: mapp
name: Mapp Marketing Cloud
description: 'Mapp is a German-headquartered marketing technology vendor whose Mapp Marketing Cloud combines
  cross-channel campaign execution (Mapp Engage), digital analytics and customer intelligence (Mapp Intelligence,
  formerly Webtrekk), product catalog management, and AI fashion/retail recommendations (Mapp Fashion, formerly
  Dressipi). The platform is API-addressable across four public surfaces: the Mapp Engage REST API (REST 2.0 /
  v19, HTTP Basic auth, ~196 documented operations covering contacts, memberships, groups, messages, mobile push,
  segmentation, whiteboards, attributes, e-commerce events and audit logs), the Mapp Intelligence Analytics API
  (OAuth2 client-credentials on api.mapp.com/api/analytics), the Product Catalog Public API, and the Mapp Fashion
  recommendation API. Mapp publishes machine-readable OpenAPI fragments for every endpoint on docs.mapp.com,
  an llms.txt documentation index, published list pricing, and an ISO 27001/27017/27018/27701/22301 trust center.'
