apis:
- aid: mapp:engage
  name: Mapp Engage API
  description: 'The Mapp Engage REST API (REST 2.0, incremental version v19) exchanges data between external
    systems and Mapp Engage: create and update contacts, manage group memberships and attributes, send single,
    transactional and prepared messages, manage mobile push, build and publish segments and whiteboards, register
    e-commerce events (abandoned cart/browse, wish list, transactions), and retrieve Log Tracker audit events.
    Authentication is HTTP Basic with a system user of type API. The base URL is tenant-specific: your Engage
    login host plus /api/rest/v19.'
  humanURL: https://docs.mapp.com/apidocs/engage-api
  baseURL: https://{engage-host}/api/rest/v19
  tags:
  - Marketing Automation
  - Email
  - Messaging
  - Contacts
  - Push Notifications
  properties:
  - type: OpenAPI
    url: openapi/mapp-engage-openapi.yml
  - type: Overlay
    url: overlays/mapp-engage-overlay.yaml
  - type: Documentation
    url: https://docs.mapp.com/apidocs/engage-api
  - type: GettingStarted
    url: https://docs.mapp.com/apidocs/getting-started-with-engage-api
  - type: APIReference
    url: https://docs.mapp.com/apidocs/engage-api-calls
- aid: mapp:intelligence-analytics
  name: Mapp Intelligence Analytics API
  description: 'The Mapp Intelligence Analytics API gives programmatic access to Mapp Intelligence (formerly
    Webtrekk) digital-analytics data and functions — submit analysis queries (pivot, comparison, time series,
    path, cross table), request reports, poll calculation status, retrieve results, list available dimensions,
    metrics, segments and dynamic time filters, and check monthly analysis usage. OAuth2 client-credentials
    against https://auth.mapp.com/oauth2/token; errors are returned as RFC 9457 problem+json.'
  humanURL: https://docs.mapp.com/apidocs/analytics-api
  baseURL: https://api.mapp.com/api/analytics
  tags:
  - Analytics
  - Digital Analytics
  - Reporting
  - Segments
  properties:
  - type: OpenAPI
    url: openapi/mapp-intelligence-analytics-openapi.yml
  - type: Overlay
    url: overlays/mapp-intelligence-analytics-overlay.yaml
  - type: Documentation
    url: https://docs.mapp.com/apidocs/analytics-api
  - type: APIReference
    url: https://docs.mapp.com/apidocs/analysis-analytics-api
  - type: Postman
    url: https://cdn.document360.io/554b9b98-6720-4d8b-9919-c7b203d72648/Images/Documentation/Analytics%20API.postman_collection.json
- aid: mapp:product-catalog
  name: Mapp Product Catalog Public API
  description: 'The Product Catalog Public API manages product and variant data inside Mapp Cloud catalogs —
    create, replace, partially update, upsert, bulk-load and delete variants, manage variant attributes, read
    catalog and attribute metadata for a workspace, and list variants for a product. Bearer-JWT (Keycloak)
    authentication against https://api.mapp.com/api/product-catalog/v1.'
  humanURL: https://docs.mapp.com/apidocs/product-catalog-api
  baseURL: https://api.mapp.com
  tags:
  - E-Commerce
  - Product Catalog
  - Data Management
  properties:
  - type: OpenAPI
    url: openapi/mapp-product-catalog-openapi.yml
  - type: Overlay
    url: overlays/mapp-product-catalog-overlay.yaml
  - type: Documentation
    url: https://docs.mapp.com/apidocs/product-catalog-api
  - type: APIReference
    url: https://docs.mapp.com/apidocs/product-catalog-api-api-reference
  - type: Authentication
    url: https://docs.mapp.com/apidocs/product-catalog-api-authentification
- aid: mapp:fashion
  name: Mapp Fashion API
  description: 'The Mapp Fashion (formerly Dressipi) recommendation API returns curated fashion and retail
    recommendations: related and complementary items for a seed product, themed and facetted recommendations,
    top items, and basket-based recommendations, plus an OAuth2 authorization-code + PKCE flow for obtaining
    and refreshing JWTs. The base URL is delegated to a customer-owned domain (https://your-domain.com/api).'
  humanURL: https://docs.mapp.com/apidocs/mapp-fashion-api-documentation
  baseURL: https://{customer-domain}/api
  tags:
  - Recommendations
  - Personalization
  - Fashion
  - E-Commerce
