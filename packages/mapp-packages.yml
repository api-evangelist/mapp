note: >-
  All first-party client libraries are published from the github.com/mapp-digital organization (GitHub
  "verified" org, blog https://mapp.com). Mapp ships tracking/messaging SDKs, not API client SDKs — there
  is no generated client for the Engage REST API, the Analytics API, the Product Catalog API or the Mapp
  Fashion API in any registry. Two currency signals worth reading: the legacy Engage Android v6 line
  (com.mapp.sdk:mapp-android) is still being patched while v7 (com.mapp.sdk:engage-android) is the
  supported line, and Mapp has publicly announced v6 end-of-support; the server-side Node tracking library
  has not shipped since 2025-10-17 and remains pre-1.0.
