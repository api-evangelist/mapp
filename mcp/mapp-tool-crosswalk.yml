source: mcp/mapp-mcp.yml + openapi/*.yml
note: 'This crosswalk exists to record a divergence, not a mapping. Mapp serves a real MCP endpoint (https://mapp.com/wp-json/mcp/mcp-oauth-server)
  but it belongs to the mapp.com WordPress content platform, not to Mapp Marketing Cloud: its OAuth issuer is mapp.com,
  its only scope is "mcp", and its authorization server is unrelated to auth.mapp.com, which issues the tokens the
  product APIs accept. tools/list is OAuth-gated (401 with an RFC 9728 challenge), so no tool names are known —
  nothing was guessed to fill the table. The result: 100% of the 231 published product-API operations have no agent
  tool in front of them, which is the finding.'
