openapi: 3.2.0
info:
  title: Mapp Engage public Group Attributes API
  version: '1'
  description: 'Mapp Engage REST API (REST 2.0, incremental version v19). Assembled verbatim from the per-operation OpenAPI fragments Mapp publishes on each endpoint page of https://docs.mapp.com/apidocs/. The base URL is tenant-specific: take your Mapp Engage login host and append /api/rest/v19.'
  contact:
    name: Mapp Technical Support
    url: https://mapp.com/tech-support/
servers:
- url: /api/rest/v19
security:
- basicAuth: []
tags:
- name: Group Attributes
paths:
  /groupAttributes/create:
    post:
      tags:
      - Group Attributes
      summary: Create a group attribute
      description: ''
      operationId: create_2
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAttributeData'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAttributeData'
  /groupAttributes/delete:
    post:
      tags:
      - Group Attributes
      summary: Delete group attributes by name (bulk)
      description: ''
      operationId: delete_4
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
  /groupAttributes/get:
    get:
      tags:
      - Group Attributes
      summary: Get a single group attribute by name
      description: ''
      operationId: get_3
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: attributeName
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAttributeData'
        '404':
          description: Not found
  /groupAttributes/importAttributes:
    post:
      tags:
      - Group Attributes
      summary: Import group attributes from CSV
      description: ''
      operationId: importAttributes
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: syncMode
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAttributeImportResult'
  /groupAttributes/list:
    get:
      tags:
      - Group Attributes
      summary: List group attributes for a group
      description: ''
      operationId: list_2
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupAttributeData'
  /groupAttributes/export:
    get:
      tags:
      - Group Attributes
      summary: Trigger async CSV export of group attributes
      description: ''
      operationId: export_2
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResult'
  /groupAttributes/update:
    put:
      tags:
      - Group Attributes
      summary: Update a group attribute
      description: ''
      operationId: update_2
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAttributeData'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupAttributeData'
  /groupAttributes/validateName:
    get:
      tags:
      - Group Attributes
      summary: Validate group attribute name uniqueness within a group
      description: ''
      operationId: validateName
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: name
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: boolean
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with a Mapp Engage system user of type API (or Hybrid).
