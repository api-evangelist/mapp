  /membership/subscribeByEmail:
    post:
      tags:
      - Membership
      summary: Subscribe a contact to a group by email
      description: Subscribes a recipient to a group.<br>The recipient must exist in the system.<br><br>Example:<br><code>https://<Engage
        System Domain>/api/rest/v19/membership/subscribeByEmail?email=j.mcexample@example.com&groupId=12345978&subscriptionMode=OPT_IN</code>
      operationId: subscribeByEmail
      parameters:
      - name: email
        in: query
        description: 'Email of the user.<br><br>Important note! Some special characters in an email address must be URL encoded,
          such as the "+", "]" and "]" characters, for example:<br><br>name+surname@test.com should be encoded as name%2Bsurname@test.com<br><br>name[surname@test.com
          should be encoded as name%5Bsurname@test.com<br><br>name]surname@test.com should be encoded as name%5Dsurname@test.com<br><br>The
          "@" symbol used to separate the local part from the domain can be used with or without being URL encoded. Engage
          will accept both formats as the separator symbol. For example, both the following addresses are valid and identical
          for Engage:

          my.address@example.com or my.address%40example.com'
        required: true
        type: string
      - name: groupId
        in: query
        description: ID of the group
        required: true
        type: integer
        format: int64
        enum:
        - 0-100
      - name: subscriptionMode
        in: query
        description: CONFIRMED_OPT_IN - New contacts receive a welcome message via email when they are added to the group.
          Despite the label used for this value, the contact does not need to confirm the subscription. A single opt-in subscription.``<br>DOUBLE_OPT_IN
          - New contacts receive an invitation to join the group via email. The contact must accept the invitation before
          they are added to the group. A double opt-in subscription.<br>OPT_IN - New contacts are added to the group without
          notification.
        required: true
        type: string
        enum:
        - CONFIRMED_OPT_IN
        - DOUBLE_OPT_IN
        - OPT_IN
      responses:
        '204':
          description: ''
        '400':
          description: Parameter 'email' is not a valid email address. / User with email does not exist. / Group with id is
            archived.
        '404':
          description: 'Error response: {<br>"errorActor": "CLIENT",<br>"errorCode": "INVALID_REQUEST",<br>"message": "Not
            Found"<br>}'
