  /segmentation/find:
    post:
      tags:
      - Segmentation
      summary: Find selection plans
      description: "Returns a paged list of selection plans (without node detail). Filter, sort and paging criteria are supplied\
        \ in the request body; all fields are optional - send an empty body or <code>{}</code> to list with server defaults.<br/><br/><b>Body\
        \ fields</b> (all optional):<ul><li><b>page</b> - zero-based page index (default 0).</li><li><b>size</b> - page size\
        \ (default: server page size).</li><li><b>sort</b> - array of <code>\"field,asc|desc\"</code>; the first entry is\
        \ the primary key, the rest are tie-breakers. E.g. <code>\"overviewCount.size,desc\"</code>, <code>\"createdOn,asc\"\
        </code>.</li><li><b>name</b> - case-insensitive substring match on plan name.</li><li><b>status</b> - exact status,\
        \ e.g. <code>draft</code> or <code>published</code>.</li><li><b>labels</b> - label filter.</li><li><b>id</b> - substring\
        \ match on plan id.</li><li><b>selectionTermId</b> - match on the published selection term id.</li><li><b>createdByName</b>\
        \ - case-insensitive substring on the creator's display name.</li><li><b>createdBefore / updatedBefore / publishedBefore</b>\
        \ - ISO-8601 timestamp upper bounds.</li></ul><b>Example body</b><pre>{\n  \"page\": 0,\n  \"size\": 3,\n  \"sort\"\
        : [\"overviewCount.size,desc\", \"createdOn,asc\"],\n  \"name\": \"544\"\n}</pre>"
      operationId: find_2
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        description: Filter, sort and paging criteria. All fields optional - send {} for server defaults. See the operation
          description for the full field list.
        required: false
        schema:
          $ref: '#/definitions/SegmentationSearchRequest'
        x-examples:
          application/json: "{\n  \"page\": 0,\n  \"size\": 3,\n  \"sort\": [\"overviewCount.size,desc\", \"createdOn,asc\"\
            ],\n  \"name\": \"544\"\n}"
      responses:
        '200':
          description: A paged list of matching plans (without node detail).
          schema:
            $ref: '#/definitions/SegmentationSearchResult'
        '400':
          description: bad request
