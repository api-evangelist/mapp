  /meta/mergeAttributeDefinitions:
    post:
      tags:
      - Meta
      summary: Merge attribute definitions
      description: 'Updates the list of custom attributes that are available on the interface. It is used to archive, activate,
        and create custom attributes. This call affects every custom attribute that is available in your system. It updates
        all of the attributes that are available for saving user data and reusing it in a different context. If an attribute
        is not mentioned, it is automatically deactivated. Errors and changes are delivered at the end of the process when
        all attributes are processed. The update cannot be used in an interactional way. Errors do not stop the update process.
        The attribute with the error is skipped and the process continues with the next attribute. It is not possible to change
        the attribute name, type, or enumeration with this method. The results of the merge method are as follows: * New attributes
        are created if the attribute is listed and did not exist before. * Custom attributes that are not listed are archived.
        * Custom attributes that are listed and are identical to the ones that already exist have no state change. * Custom
        attributes that are archived and not listed remain archived. * Custom attributes that have a state other than archived/active
        generate an error and remain unchanged.<br>Request body example: <br><br><pre>[{<br>"name": "attributename",<br>"type":
        "STRING",<br>"enumerationValues":<br>[<br>"value1",<br>"value2",<br>"value3"<br>],<br>"active": "true"<br>}]</pre>'
      operationId: mergeAttributeDefinitions
      consumes:
      - application/json
      parameters:
      - in: body
        name: body
        required: false
        schema:
          type: array
          items:
            $ref: '#/definitions/AttributeDefinition'
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              type: object
        '400':
          description: ''
