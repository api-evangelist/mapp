      description: 'Replaces all attribute values for a specific user. All attribute values that are transmitted with the
        method are added and replace any existing values.<br><br>Any currently existing attribute values that are not found
        in the API call are deleted (except for Member attributes).<br>Request body example: <br><pre>[<br>  {"name" : "user.firstname",
