  /message/sendTransactionalWithEventDetails:
    post:
      tags:
      - Message
      summary: Send a transactional message with event details
      description: 'Sends a previously prepared message as a transactional message including transaction details such as purchase
        confirmation, <br>and adds user as member to group the prepared message belong to .<br> Please be aware this may cause
        that user to be unexpectedly subscribed or re-subscribed to that group. <br><br>User can iterate through the list
        of items using for each expression to access the individual item.<br><br>User can specify any number of attributes
        aka transaction_details and access them using expression language.<br><br>It is strongly recommended to use the same
        structure for each item. <br><br>EXPLANATION<br>Var value refers to a single object inside the list of itemDetails,
        the name can by anything, in this case, it''s the product.<br><br>Items value refers to eventDetails which is a placeholder
        for the list of items we want to show.<br>Max value is a limit of items to be displayed.<br>If you have max=50 but
        your JSON has less items, all of them will be displayed.<br>In the case of JSON with a number greater than the limit,
        the first 50 items will be shown and the rest will be ignored.<br>Inside ForEach, user can access itemDetails property
        using an array index with the name of the property user wants to access<br><br>Note that all query parameters are
        case-sensitive. Take a look at an example below:<br>- not "eventdetails" but "eventDetails"<br>- not "itemdetails
        " but "itemDetails"<br> "Request body example: <br><br>"<pre>{<br>"parameters":<br>   [<br>       {"name" : "Parameter
        Name 1","value" : "Parameter Value 1"},<br>       {"name" : "Parameter Name 2","value": "Parameter Value 2"}<br>   ],<br>  "attachments":
        [<br>    {<br>      "name": "twitter_logo.png",<br>      "contentType": "image/png",<br>      "content": ""<br>    }<br>  ],<br>"transaction":
        false   /*(optional attribute)*/<br>"eventDetailsProcessing":   /*(optional attribute)*/<br>   {<br>      "groupBy":"brandName",<br>      "groupLabel":"brandName",<br>      "valueField":"productName"<br>   },<br>"eventDetails":<br>   [<br>      {<br>          "itemDetails":[<br>                {"name":"productName","value":"Chair
        C1"},<br>                {"name":"brandName", "value":"aaa aaa"}<br>              ]<br>      },<br>      {<br>          "itemDetails":[<br>                {"name":"productName","value":"Sofa
        S1"},<br>                {"name":"brandName", "value":"bbb bbb"}<br>              ]<br> <br>      },<br>      {<br>          "itemDetails":[<br>               {"name":"productName","value":"Bed
        B1"},<br>                {"name":"brandName", "value":"cccc cccc"}<br>              ]<br> <br>      }<br>   ]<br>}</pre>'
      operationId: sendTransactionalWithEventDetails
      consumes:
      - application/json
      parameters:
      - name: messageId
        in: query
        description: ID of the message or prepared message
        required: false
        type: integer
        format: int64
      - name: externalTransactionFormula
        in: query
        description: External transactional identifier
        required: false
        type: string
      - name: recipientId
        in: query
        description: ID of the user
        required: false
        type: integer
        format: int64
      - in: body
        name: body
        required: false
        schema:
          $ref: '#/definitions/TransactionalMessageContent'
      responses:
        '204':
          description: ''
        '400':
          description: 'Missing parameter (messageId/recipientId) or parameter value, for example:<br><br><pre>{<br>  "errorActor":
            "CLIENT",<br>  "errorCode": "MISSING_PARAMETER",<br>  "message": "Parameter ''messageId'' is mandatory but no
            value was specified.",<br>  "parameterName": "messageId",<br>  "propertyName": null,<br>  "value": "null"<br>}</pre><br><br>Message
            ID or recipient does not exist, for example:<br><br><pre>{<br>  "errorActor": "CLIENT",<br>  "errorCode": "NO_SUCH_OBJECT",<br>  "message":
            "Message with id=24011454555 does not exist.",<br>  "objectType": "Message",<br>  "propertyName": "id",<br>  "propertyValue":
            "24011454555"<br>}</pre>'
  /message/sendTransactional:
    post:
      tags:
      - Message
      summary: Send a transactional message
      description: 'Sends a prepared message as a transactional message, and adds user as member to group the prepared message
        belong to. <br> Please be aware this may cause that user to be unexpectedly subscribed or re-subscribed to that group.
        <br>Attachments may be added as part of the JSON payload. If you wish to attach a file to the message, the data must
        be Base64 encoded <br>and added as the value of the attachment’s content string, as demonstrated below. Request body
        example with attachment: <br><br><pre>{<br>"parameters":<br>  [{"name" : "Parameter Name 1","value" : "Parameter Value
        1"},<br>   {"name" : "Parameter Name 2","value": "Parameter Value 2"}],<br>    "attachments":<br>    [{"name" : "twitter_logo.png",<br>      "contentType"
        : "image/png",<br>      "content": ""}]<br>}</pre>'
      operationId: sendTransactional
      consumes:
      - application/json
      parameters:
      - name: messageId
        in: query
        description: ID of the message or prepared message
        required: false
        type: integer
        format: int64
      - name: externalTransactionFormula
        in: query
        description: External transactional identifier. If not available, "null" can be used.
        required: false
        type: string
      - name: recipientId
        in: query
        description: ID of the user
        required: false
        type: integer
        format: int64
      - in: body
        name: body
        required: false
        schema:
          $ref: '#/definitions/MessageContent'
      - name: senderProfileName
        in: query
        description: TLS sender profile. Requires a Feature Switch and setting up a profile name in Mapp Engage. (optional)
        required: false
        type: string
      responses:
        '204':
          description: ''
        '400':
          description: 'Missing parameter (messageId/recipientId) or parameter value, for example:<br><br><pre>{<br>  "errorActor":
            "CLIENT",<br>  "errorCode": "MISSING_PARAMETER",<br>  "message": "Parameter ''messageId'' is mandatory but no
            value was specified.",<br>  "parameterName": "messageId",<br>  "propertyName": null,<br>  "value": "null"<br>}</pre><br><br>Message
            ID or recipient does not exist, for example:<br><br><pre>{<br>  "errorActor": "CLIENT",<br>  "errorCode": "NO_SUCH_OBJECT",<br>  "message":
            "Message with id=24011454555 does not exist.",<br>  "objectType": "Message",<br>  "propertyName": "id",<br>  "propertyValue":
            "24011454555"<br>}</pre>'
