  /ecommerce/registerTransaction:
    post:
      tags:
      - Ecommerce
      summary: Register a transaction
      description: 'Register an ecommerce transaction

        Request body example - with custom columns:


        {

        "transactionItems": [

        {

        "orderId": "20220204",

        "productName": "BOSS bag",

        "productSKU": "XXX-123-ABC",

        "category": "Exclusive bags",

        "brand": "BOSS",

        "storeId": "gdg4535fsgdfg",

        "purchaseSource": "http://www.mango.com",

        "discountValue": "0",

        "variant": "BLACK",

        "productQuantity": "2",

        "discountPercentage": "2",

        "imageURL": "http://www.boss.com/bag.jpg",

        "productURL": "http://www.boss.com/bag.jpg",

        "currency": "PLN",

        "timestamp": "2022-02-03T18:25:43",

        "productPrice": "45",

        "customDetail1": "90",

        "customDetail2": "2022-02-03",

        "customDetail3": "Sent"

        }

        ]

        }


        Request body example - 2 items:


        {

        "transactionItems": [

        {

        "orderId": "123",

        "productName": "BOSS bag",

        "productSKU": "XXX-123-ABC",

        "category": "Exclusive bags",

        "brand": "BOSS",

        "storeId": "gdg4535fsgdfg",

        "purchaseSource": "http://www.mango.com",

        "discountValue": "0",

        "variant": "BLACK",

        "productQuantity": "1",

        "discountPercentage": "2",

        "imageURL": "http://www.boss.com/bag.jpg",

        "productURL": "http://www.boss.com/bag.jpg",

        "currency": "PLN",

        "timestamp": "2021-12-15T18:25:43",

        "productPrice": "45"

        },

        {

        "orderId": "124",

        "productName": "Black Socks",

        "productSKU": "XXX-123-UIO",

        "category": "Premium Socks",

        "brand": "Atlantic",

        "storeId": "gdg4535fsgdfg",

        "purchaseSource": "http://www.mango.com",

        "discountValue": "0",

        "variant": "RED",

        "productQuantity": "2",

        "discountPercentage": "1",

        "imageURL": "http://www.atlantic.com/socks.jpg",

        "productURL": "http://www.atlantic.com/socks.jpg",

        "currency": "PLN",

        "timestamp": "2021-12-15T18:25:43",

        "productPrice": "12"

        }

        ]

        }'
      operationId: registerTransaction
      parameters:
      - name: userEmail
        in: query
        description: Email of the user
        required: true
        schema:
          type: string
      - name: transaction
        in: query
        description: Transaction item
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
        '400':
          description: Required parameters are missing or incorrect.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with a Mapp Engage system user of type API (or Hybrid).
